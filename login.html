<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Royal Stay</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="navbar">
    <div class="logo">Royal<span>Stay</span></div>

    <nav>
        <a href="index.html">Home</a>
        <a href="rooms.html">Rooms</a>
        <a href="booking.html">Book Now</a>
    </nav>
</header>

<section class="login-section">

    <div class="login-box">

        <h2>Admin Login</h2>
        <p>Login to manage hotel bookings</p>

        <form id="loginForm">

            <div class="form-group">
                <label>Username</label>
                <input type="text" id="username" placeholder="Enter username" required>
            </div>

            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" placeholder="Enter password" required>
            </div>

            <button type="submit" class="submit-btn">Login</button>

            <p id="loginError" class="login-error"></p>

        </form>

        <div class="demo-login">
            <small>Demo Username: admin</small><br>
            <small>Demo Password: 12345</small>
        </div>

    </div>

</section>

<footer>
    <p>© 2026 Royal Stay Hotel. All Rights Reserved.</p>
</footer>

<script src="js/app.js"></script>

</body>
</html>
